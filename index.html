<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="description" content="Kameranızla yazıyı tarayın, seçtiğiniz dile çevirin" />
  <link rel="manifest" href="manifest.json" />
  <title>Kamera Çevirmeni</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Kamera Çevirmeni</h1>
    <div class="lang-selector">
      <label for="target-lang">Hedef Dil:</label>
      <select id="target-lang">
        <option value="tr" selected>Türkçe</option>
        <option value="en">İngilizce</option>
        <option value="de">Almanca</option>
        <option value="fr">Fransızca</option>
        <option value="es">İspanyolca</option>
        <option value="it">İtalyanca</option>
        <option value="pt">Portekizce</option>
        <option value="ru">Rusça</option>
        <option value="ar">Arapça</option>
        <option value="zh">Çince</option>
        <option value="ja">Japonca</option>
        <option value="ko">Korece</option>
      </select>
    </div>
  </header>

  <main>
    <section class="camera-section">
      <video id="camera-preview" autoplay playsinline muted></video>
      <canvas id="capture-canvas" style="display:none"></canvas>
      <div class="camera-controls">
        <button id="capture-btn" class="btn-primary">📷 Yakala ve Çevir</button>
        <button id="auto-btn" class="btn-secondary">🔄 Canlı Tarama</button>
        <label for="file-input" class="btn-secondary">🖼️ Galeri</label>
        <input type="file" id="file-input" accept="image/*" hidden />
      </div>
    </section>

    <section class="status-section">
      <div id="status-text" class="status-text"></div>
      <div id="detected-lang" class="detected-lang"></div>
      <div class="progress-bar">
        <div id="ocr-progress" class="progress-fill"></div>
      </div>
    </section>

    <section class="manual-section">
      <h2>Klavyeyle Çevir</h2>
      <textarea id="manual-text" rows="3" placeholder="Çevrilecek metni buraya yazın..."></textarea>
      <button id="manual-translate" class="btn-primary">Çevir</button>
    </section>

    <section class="result-section">
      <h2>OCR Sonucu</h2>
      <div id="ocr-text" class="result-box" aria-live="polite"></div>
      <h2>Çeviri</h2>
      <div id="translated-text" class="result-box" aria-live="polite"></div>
    </section>

    <button id="install-btn" class="btn-install" style="display:none">📲 Uygulamayı Yükle</button>
  </main>

  <footer>
    <small>OCR: Tesseract.js (cihaz üzeri) • Çeviri: MyMemory</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
