<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera Çevirmeni</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f7fa; padding: 12px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin-bottom: 10px; color: #1a73e8; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  select, button, textarea { font-size: 0.95rem; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
  button { background: #1a73e8; color: #fff; border: none; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; }
  #video { width: 100%; max-height: 45vh; background: #000; border-radius: 12px; object-fit: cover; }
  #canvas { display: none; }
  .box { background: #fff; border-radius: 12px; padding: 12px; margin-top: 8px; min-height: 50px; white-space: pre-wrap; word-break: break-word; font-size: 0.95rem; }
  .status { font-size: 0.85rem; color: #666; margin: 6px 0; min-height: 18px; }
  .label { font-size: 0.8rem; color: #1a73e8; font-weight: 600; margin-top: 12px; }
  .error { color: #dc2626; }
  .lang-info { font-size: 0.8rem; color: #059669; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>
<h1>Kamera Çevirmeni</h1>

<div class="row">
  <select id="targetLang">
    <option value="tr" selected>Türkçe</option>
    <option value="en">İngilizce</option>
    <option value="de">Almanca</option>
    <option value="fr">Fransızca</option>
    <option value="ar">Arapça</option>
    <option value="ru">Rusça</option>
  </select>
  <button id="captureBtn">📷 Yakala ve Çevir</button>
  <label style="background:#fff;padding:10px;border-radius:8px;border:1px solid #ddd;cursor:pointer;">
    🖼️ Galeri <input type="file" id="fileInput" accept="image/*" hidden>
  </label>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status" class="status">Kamera başlatılıyor...</div>
<div id="langInfo" class="lang-info"></div>

<div class="label">OCR Sonucu</div>
<div id="ocrText" class="box"></div>

<div class="label">Çeviri</div>
<div id="translatedText" class="box"></div>

<div class="row" style="margin-top:10px;">
  <textarea id="manualText" rows="2" placeholder="Klavyeyle metin girin..." style="flex:1;min-width:200px;"></textarea>
  <button id="manualBtn">Çevir</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const langInfoEl = document.getElementById('langInfo');
const ocrEl = document.getElementById('ocrText');
const transEl = document.getElementById('translatedText');
const targetLang = document.getElementById('targetLang');
const captureBtn = document.getElementById('captureBtn');
const fileInput = document.getElementById('fileInput');
const manualText = document.getElementById('manualText');
const manualBtn = document.getElementById('manualBtn');

let worker = null;
let busy = false;

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (isError ? ' error' : '');
}

// Kamera
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    setStatus('Kamera hazır. Metne yöneltip "Yakala"ya basın.');
  } catch (e) {
    setStatus('Kamera açılamadı: ' + e.message, true);
  }
}

// OCR worker — daha az dil paketi = daha yüksek doğruluk
async function getWorker() {
  if (worker) return worker;
  setStatus('OCR motoru yükleniyor...');
  worker = await Tesseract.createWorker('eng+tur+deu+fra+ara+rus', 1, {
    logger: m => {
      if (m.status === 'recognizing text') {
        setStatus(`Metin okunuyor... %${Math.round(m.progress * 100)}`);
      }
    }
  });
  // Sayfa segmentasyon modu: tek blok (tabela/menü için ideal)
  await worker.setParameters({ tessedit_pageseg_mode: '6' });
  return worker;
}

// Görüntü ön işleme: gri ton + kontrast artırma
function preprocess(imageSource) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      const maxW = 1500;
      let w = img.width, h = img.height;
      if (w > maxW) { h = h * (maxW / w); w = maxW; }
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const imageData = ctx.getImageData(0, 0, w, h);
      const d = imageData.data;

      // Gri tonlama + kontrast
      for (let i = 0; i < d.length; i += 4) {
        let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        // Kontrast artır (threshold benzeri)
        gray = gray > 128 ? 255 : 0;
        d[i] = d[i+1] = d[i+2] = gray;
      }
      ctx.putImageData(imageData, 0, 0);
      resolve(c.toDataURL('image/png'));
    };
    img.src = imageSource;
  });
}

// OCR
async function doOCR(imageSource) {
  const w = await getWorker();
  const processed = await preprocess(imageSource);
  const { data } = await w.recognize(processed);
  return (data.text || '').trim();
}

// MyMemory çeviri + kaynak dil bilgisi
async function doTranslate(text) {
  if (!text) return { translated: '', detectedLang: '' };
  const maxBytes = 450;
  const chunks = [];
  let current = '';
  for (const ch of text) {
    if (new TextEncoder().encode(current + ch).length > maxBytes) {
      chunks.push(current);
      current = ch;
    } else { current += ch; }
  }
  if (current) chunks.push(current);

  const results = [];
  let detectedLang = '';
  for (const chunk of chunks) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=${encodeURIComponent('autodetect|' + targetLang.value)}`;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (json.responseStatus === 200 && json.responseData?.translatedText) {
        results.push(json.responseData.translatedText);
        // MyMemory yanıtında kaynak dil bilgisi varsa al
        if (!detectedLang && json.responseData.detectedLanguage) {
          detectedLang = json.responseData.detectedLanguage;
        }
      } else {
        results.push('[Çeviri hatası: ' + (json.responseDetails || json.responseStatus) + ']');
      }
    } catch (e) {
      results.push('[Bağlantı hatası]');
    }
    await new Promise(r => setTimeout(r, 250));
  }
  return { translated: results.join(' '), detectedLang };
}

// Dil kodunu okunabilir isme çevir
function langName(code) {
  const map = {
    'tr': 'Türkçe', 'en': 'İngilizce', 'de': 'Almanca', 'fr': 'Fransızca',
    'ar': 'Arapça', 'ru': 'Rusça', 'es': 'İspanyolca', 'it': 'İtalyanca',
    'pt': 'Portekizce', 'nl': 'Felemenkçe', 'pl': 'Lehçe', 'el': 'Yunanca',
    'zh': 'Çince', 'ja': 'Japonca', 'ko': 'Korece'
  };
  return map[code] || code.toUpperCase();
}

// Ana işlem
async function process(imageSource) {
  if (busy) return;
  busy = true;
  captureBtn.disabled = true;
  manualBtn.disabled = true;
  ocrEl.textContent = '';
  transEl.textContent = '';
  langInfoEl.textContent = '';

  try {
    setStatus('Metin okunuyor...');
    const text = await doOCR(imageSource);
    if (!text) {
      setStatus('Yazı bulunamadı. Daha net bir görüntü deneyin.', true);
      return;
    }
    ocrEl.textContent = text;

    setStatus('Dil algılanıyor ve çevriliyor...');
    const { translated, detectedLang } = await doTranslate(text);
    transEl.textContent = translated;

    if (detectedLang) {
      langInfoEl.textContent = `Algılanan kaynak dil: ${langName(detectedLang)} (${detectedLang})`;
    } else {
      langInfoEl.textContent = 'Kaynak dil bilgisi alınamadı (MyMemory bu çift için döndürmedi).';
    }

    setStatus('✓ Tamamlandı');
  } catch (e) {
    console.error(e);
    setStatus('Hata: ' + e.message, true);
  } finally {
    busy = false;
    captureBtn.disabled = false;
    manualBtn.disabled = false;
  }
}

// Yakala
captureBtn.addEventListener('click', () => {
  if (!video.videoWidth) { setStatus('Kamera hazır değil.', true); return; }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  process(canvas.toDataURL('image/jpeg', 0.9));
});

// Galeri
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => process(reader.result);
  reader.readAsDataURL(file);
  fileInput.value = '';
});

// Klavye
manualBtn.addEventListener('click', async () => {
  const text = manualText.value.trim();
  if (!text || busy) return;
  busy = true;
  manualBtn.disabled = true;
  ocrEl.textContent = text;
  transEl.textContent = '';
  langInfoEl.textContent = '';
  try {
    setStatus('Çevriliyor...');
    const { translated, detectedLang } = await doTranslate(text);
    transEl.textContent = translated;
    if (detectedLang) langInfoEl.textContent = `Algılanan kaynak dil: ${langName(detectedLang)} (${detectedLang})`;
    setStatus('✓ Tamamlandı');
  } catch (e) {
    setStatus('Hata: ' + e.message, true);
  } finally {
    busy = false;
    manualBtn.disabled = false;
  }
});

// Başlat
initCamera();
getWorker().catch(e => setStatus('OCR yüklenemedi: ' + e.message, true));
</script>
</body>
</html>
